<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f7f5" />
    <title>行旅簿 | 旅游攻略 Agent</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="会话导航">
        <div class="sidebar-brand">
          <div class="brand-mark" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </div>
          <div>
            <p class="eyebrow">TRAVEL DESK</p>
            <h1>行旅簿</h1>
          </div>
        </div>

        <button class="new-session-button" id="newSessionBtn" type="button">
          <span class="button-symbol" aria-hidden="true">+</span>
          <span>新建会话</span>
        </button>

        <div class="session-section">
          <div class="section-heading">
            <span>我的行程</span>
            <span class="session-count" id="sessionCount">0</span>
          </div>
          <nav id="sessionList" class="session-list" aria-label="会话列表"></nav>
        </div>

        <div class="sidebar-footer">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="storageMode">本地演示模式</span>
        </div>
      </aside>

      <main class="workspace">
        <header class="workspace-header">
          <div class="header-leading">
            <button
              class="icon-button mobile-only"
              id="menuBtn"
              type="button"
              aria-label="打开会话导航"
              title="打开会话导航"
            >
              <span aria-hidden="true">☰</span>
            </button>
            <div>
              <p class="eyebrow">CURRENT ITINERARY</p>
              <h2 id="sessionTitle">新的行程</h2>
            </div>
          </div>
          <div class="header-actions">
            <span class="connection-label">
              <span class="status-dot" aria-hidden="true"></span>
              <span id="connectionStatus">等待输入</span>
            </span>
            <button
              class="icon-button"
              id="clearBtn"
              type="button"
              aria-label="清空当前会话"
              title="清空当前会话"
            >
              <span aria-hidden="true">⌫</span>
            </button>
          </div>
        </header>

        <section class="conversation" id="chatLog" aria-live="polite" aria-label="对话内容"></section>

        <footer class="composer-area">
          <div class="composer-wrap">
            <form id="chatForm" class="composer">
              <label class="sr-only" for="messageInput">输入旅行需求</label>
              <textarea
                id="messageInput"
                name="message"
                rows="1"
                placeholder="告诉我你想去哪里，几天，和在意的事..."
                autocomplete="off"
                required
              ></textarea>
              <button id="sendBtn" class="send-button" type="submit" aria-label="发送消息" title="发送消息">
                <span class="send-label">发送</span>
                <span class="send-symbol" aria-hidden="true">↗</span>
              </button>
            </form>
            <div class="composer-hint">
              <span>Enter 换行</span>
              <span>Ctrl / Cmd + Enter 发送</span>
            </div>
          </div>
        </footer>
      </main>
    </div>

    <div class="sidebar-backdrop" id="sidebarBackdrop" hidden></div>
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.9/dist/purify.min.js"></script>
    <script type="module" src="/static/js/app.js"></script>
  </body>
</html>
